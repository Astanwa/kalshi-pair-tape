<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalshi BTC 15m pair tape</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--text:#e6e6e6;--muted:#8a8f9a;--green:#3ddc84;--red:#ff5c5c;--line:#2a2f3a}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 2px}.sub{color:var(--muted);margin-bottom:10px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.tile .k{color:var(--muted);font-size:12px}.tile .v{font-size:18px;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--muted);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}svg{width:100%;height:150px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:12px}.both{background:#1f4d33;color:var(--green)}.single{background:#4d1f1f;color:var(--red)}.none{background:#2a2f3a;color:var(--muted)}.open{background:#3a3520;color:#e8c547}
details summary{cursor:pointer;color:var(--muted);margin:6px 0}
</style></head><body>
<h1>Kalshi BTC 15m pair tape (paper)</h1>
<div class="sub" id="sub">loading…</div>
<div id="root"></div>
<script>
const money=x=>(x>=0?'+':'')+x.toFixed(2);const cls=x=>x>0?'pos':x<0?'neg':'';const leg=(st,at)=>st==='filled'?`filled ${at?at.slice(11,19)+'Z':''}`:st;
async function load(){const bust='?t='+Date.now();const s=await (await fetch('data/summary.json'+bust)).json();
$('#sub').textContent=`rest buy-YES and buy-NO at ${s.level} every 15-minute window, ${s.contracts_per_leg} contracts per leg · pair pays 0.20/contract when both fill, a lone leg risks 0.40 · breakeven ≈ 67% paired · updated ${new Date(s.generated_at).toLocaleString()} · auto-refresh 60s`;
let html='';
for(const [ledger,st] of Object.entries(s.strategies)){const rows=await (await fetch(st.rows_file+bust)).json();const filled=st.both+st.single;
const tiles=[['Settled windows',st.windows_settled],['Both legs filled',`${st.both} (${filled?Math.round(100*st.both/filled):0}%)`],['One leg filled',`${st.single} (${st.single_won} won)`],['Nothing filled',st.none],['P&L',money(st.pnl),cls(st.pnl)],['Cash',`${st.cash} / ${st.start_cash}`]];
const settled=rows.filter(r=>r.status==='settled');let cum=0;const pts=settled.map(r=>cum+=(r.pnl||0));let svg='';
if(pts.length>1){const lo=Math.min(0,...pts),hi=Math.max(0,...pts),sp=(hi-lo)||1;const X=i=>i/(pts.length-1)*790+5,Y=v=>140-(v-lo)/sp*130;svg=`<svg viewBox="0 0 800 150" preserveAspectRatio="none"><line x1="5" y1="${Y(0)}" x2="795" y2="${Y(0)}" stroke="#2a2f3a"/><polyline fill="none" stroke="${cum>=0?'#3ddc84':'#ff5c5c'}" stroke-width="2" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><text x="8" y="14" fill="#8a8f9a" font-size="11">cumulative P&amp;L ${money(cum)}</text></svg>`;}
html+=`<h2>${st.label}</h2><div class="sub">${st.note}</div><div class="tiles">${tiles.map(t=>`<div class="tile"><div class="k">${t[0]}</div><div class="v ${t[2]||''}">${t[1]}</div></div>`).join('')}</div>${svg}
<div class="wrap"><table><thead><tr><th>Day (ET)</th><th>Windows</th><th>Both</th><th>Single</th><th>None</th><th>Both %</th><th>P&amp;L</th></tr></thead><tbody>${st.by_day.slice().reverse().map(d=>`<tr><td>${d.day}</td><td>${d.n}</td><td>${d.both}</td><td>${d.single}</td><td>${d.none}</td><td>${(d.both+d.single)?Math.round(100*d.both/(d.both+d.single)):0}%</td><td class="${cls(d.pnl)}">${money(d.pnl)}</td></tr>`).join('')}</tbody></table></div>
<details><summary>last 60 windows</summary><div class="wrap"><table><thead><tr><th>Window (ET)</th><th>Mid at post</th><th>YES leg</th><th>NO leg</th><th>Vol ≤0.40 yes/no</th><th>Outcome</th><th>Result</th><th>P&amp;L</th></tr></thead><tbody>${rows.slice(-60).reverse().map(r=>{const o=r.status!=='settled'?'open':r.outcome==='both'?'both':r.outcome==='none'?'none':'single';return `<tr><td>${r.window_et}</td><td>${r.mid_at_post==null?'':r.mid_at_post.toFixed(2)}</td><td>${leg(r.yes_status,r.yes_filled_at)}</td><td>${leg(r.no_status,r.no_filled_at)}</td><td>${r.yes_vol||0} / ${r.no_vol||0}</td><td><span class="tag ${o}">${r.status==='settled'?r.outcome:'resting'}</span></td><td>${r.result||''}</td><td class="${cls(r.pnl||0)}">${r.pnl==null?'':money(r.pnl)}</td></tr>`}).join('')}</tbody></table></div></details>`;}
$('#root').innerHTML=html;}
const $=s=>document.querySelector(s);load();setInterval(load,60000);
</script></body></html>
